<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>加密货币价格监控</title>
    <link rel="stylesheet" href="/assets/crypto_monitor.css" />
</head>
<body>
    <div class="app-shell">
        <header class="top-bar">
            <div class="title-group">
                <h1>加密货币价格监控</h1>
                <p class="subtitle">实时追踪行情，智能提醒不错过</p>
            </div>
            <div class="top-actions">
                <div id="status-indicator" class="status status-idle">等待连接</div>
                <button id="open-settings-btn" class="ghost-button" type="button">设置</button>
            </div>
        </header>

        <main class="content">
            <section class="price-card">
                <div class="symbol-row">
                    <span class="label">当前交易对</span>
                    <span id="symbol-display" class="symbol">BTCUSDT</span>
                </div>

                <div id="price-digits" class="price-digits"></div>

                <div class="timestamp-row">
                    <span class="label">最后更新时间</span>
                    <div class="flip-container timestamp-container">
                        <div class="flip-card" id="timestamp-card">
                            <div class="flip-face front">
                                <span id="timestamp-text">--</span>
                            </div>
                            <div class="flip-face back">
                                <span>--</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="insight-card">
                <h2>提醒日志</h2>
                <div id="alert-log" class="alert-log">暂无提醒记录</div>
            </section>
        </main>
    </div>

    <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="modal-backdrop" data-close="true"></div>
        <div class="modal-panel">
            <header class="modal-header">
                <h2 id="settings-title">监控设置</h2>
                <button id="close-settings-btn" class="icon-button" type="button" aria-label="关闭设置">×</button>
            </header>
            <div class="modal-body">
                <section class="modal-section">
                    <h3>基础设置</h3>
                    <div class="field-grid">
                        <label class="field">
                            <span>交易对</span>
                            <select id="symbol-select"></select>
                        </label>
                        <label class="field">
                            <span>检查间隔 (秒)</span>
                            <input id="interval-input" type="number" min="5" step="1" />
                        </label>
                    </div>
                </section>

                <section class="modal-section">
                    <div class="section-header">
                        <h3>提醒规则</h3>
                        <button id="add-rule-btn" class="ghost-button small" type="button">新增规则</button>
                    </div>
                    <div id="rules-empty" class="rules-empty">暂无提醒规则，点击“新增规则”开始设置。</div>
                    <div id="rules-container" class="rules-container"></div>
                </section>

                <section class="modal-section">
                    <h3>邮件通知</h3>
                    <div class="field-grid">
                        <label class="field">
                            <span>发件邮箱</span>
                            <input id="email-sender" type="email" placeholder="例如：example@qq.com" />
                        </label>
                        <label class="field">
                            <span>授权码 / 密码</span>
                            <input id="email-password" type="password" placeholder="请输入对应授权码" />
                        </label>
                        <label class="field">
                            <span>收件邮箱</span>
                            <input id="email-receiver" type="email" placeholder="提醒接收邮箱" />
                        </label>
                    </div>
                    <details class="advanced-settings">
                        <summary>SMTP 高级设置（可选）</summary>
                        <div class="field-grid">
                            <label class="field">
                                <span>SMTP 服务器</span>
                                <input id="smtp-server" type="text" placeholder="自动识别，可手动指定" />
                            </label>
                            <label class="field">
                                <span>SMTP 端口</span>
                                <input id="smtp-port" type="number" min="1" placeholder="默认 465" />
                            </label>
                        </div>
                    </details>
                </section>
            </div>
            <footer class="modal-footer">
                <div class="footer-left">
                    <button id="check-alerts-btn" class="ghost-button" type="button">手动检查提醒</button>
                    <span id="settings-feedback" class="feedback" role="status" aria-live="polite"></span>
                </div>
                <div class="footer-right">
                    <button id="save-settings-btn" class="primary-button" type="button">保存设置</button>
                </div>
            </footer>
        </div>
    </div>

    <div id="toast" class="toast hidden" role="status" aria-live="assertive"></div>

    <script src="/assets/crypto_monitor.js" defer></script>
</body>
</html>
